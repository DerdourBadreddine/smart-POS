<mat-sidenav-container class="shell" [dir]="language.language() === 'ar' ? 'rtl' : 'ltr'">
  <mat-sidenav #drawer mode="side" opened class="sidenav">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <strong>{{ settings.shopName() }}</strong>
        <span>{{ 'common.pointOfSale' | transloco }}</span>
      </div>
    </div>
    <nav class="navigation" aria-label="Main navigation">
      @for (item of navigation; track item.path) {
        <a mat-button class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label | transloco }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="drawer.toggle()" [attr.aria-label]="'common.toggleMenu' | transloco">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">{{ settings.shopName() }}</span>
      <span class="toolbar-spacer"></span>
      <button mat-stroked-button class="language-button" (click)="language.toggle()">
        {{ language.language() === 'fr' ? 'عربي' : 'FR' }}
      </button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
